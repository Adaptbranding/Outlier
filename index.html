<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlier | Deals only some stores have</title>
<meta name="description" content="Find products at deep discounts in just a few store locations. Pick a retailer to see its outlier deals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=3">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand-link" href="./"><i aria-hidden="true"></i>Outlier</a>
    <nav class="menu" id="menu" aria-label="Stores"></nav>
  </div>
</header>
<script src="assets/nav.js?v=2" data-here="home" defer></script>

<main class="wrap">
  <section class="home-hero">
    <h1>Deals only some stores have.</h1>
    <p>Retailers often cut prices deeply at a few locations and not others. Pick a store to see those outlier deals, with prices, stock and photos.</p>
    <form class="home-search" action="search/" method="get" role="search">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" name="q" placeholder="Search every store at once" autocomplete="off" aria-label="Search products, brands or SKUs in every store">
      </label>
      <button class="btn" type="submit">Search</button>
    </form>
    <p class="home-links"><a href="search/?new=1">See what's new in the latest update →</a></p>
  </section>

  <h2 class="gallery-title">Stores</h2>
  <ul class="gallery" id="gallery" aria-label="Stores"></ul>
</main>

<script>
(function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  fetch('retailers.json').then(r => r.json()).then(d => {
    const live = d.retailers.filter(x => x.live);
    const tiles = live.map(x => {
      const logo = x.logo
        ? `<img src="${esc(x.logo)}" alt="" loading="eager">`
        : `<span class="wordmark">${esc(x.name)}</span>`;
      return `<li><a class="tile" href="${esc(x.path)}" aria-label="${esc(x.name)}: ${esc(x.tagline || 'see deals')}">
        <span class="logo">${logo}</span>
        <span class="cap"><b>${esc(x.name)}</b><span>${esc(x.tagline || '')}</span></span></a></li>`;
    });
    tiles.push(`<li><div class="tile soon"><span class="logo"><span class="wordmark">More stores soon</span></span>
      <span class="cap"><b>&nbsp;</b><span>&nbsp;</span></span></div></li>`);
    document.getElementById('gallery').innerHTML = tiles.join('');
  }).catch(() => {
    document.getElementById('gallery').innerHTML = '<li>The store list could not load. Reload the page to try again.</li>';
  });
})();
</script>
</body>
</html>
