<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontario outlier deals</title>
<meta name="description" content="Canadian Tire products 50% off or more at only some Ontario stores, with price, stock and photos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #0f1319;
  --muted: #5d6675;
  --line: #e4e8ee;
  --accent: #2563eb;
  --save: #0a8f4e;
  --save-soft: #e3f6ec;
  --rare: #c2410c;
  --rare-soft: #fff0e6;
  --tint: #f4f8ff;
  --shadow: 0 1px 2px rgba(15, 19, 25, .04), 0 6px 18px rgba(37, 99, 235, .06);
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 400 16px/1.45 var(--font); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

/* Header */
.hero { padding-block: 40px 20px; }
body { background: linear-gradient(180deg, var(--tint) 0, #fff 360px) no-repeat; background-color: #fff; }
.hero h1 { margin: 0; font-size: clamp(1.9rem, 4.5vw, 2.8rem); line-height: 1.05; letter-spacing: -.03em; font-weight: 700; text-wrap: balance; }
.hero p { margin: 10px 0 0; color: var(--muted); max-width: 60ch; text-wrap: pretty; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; font-size: .9rem; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Controls */
.controls { position: sticky; top: 0; z-index: 5; background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 150px; position: relative; }
.search input { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 14px 0 40px; }
.search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.sel { position: relative; }
.sel select { appearance: none; height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 34px 0 14px; max-width: 230px; cursor: pointer; }
.sel::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); translate: 0 -70%; rotate: 45deg; pointer-events: none; }
.sel select:disabled { opacity: .45; cursor: not-allowed; }
.sel .tag { position: absolute; left: 14px; top: 5px; font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); pointer-events: none; }
.sel.labeled select { padding-top: 14px; padding-bottom: 0; height: 44px; }
.sel.labeled select { padding-left: 14px; }


.status { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 12px; color: var(--muted); font-size: .92rem; }
.status b { color: var(--ink); font-weight: 600; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.card:hover { border-color: color-mix(in srgb, var(--ink) 28%, var(--line)); transform: translateY(-2px); }
.media { position: relative; display: block; aspect-ratio: 1; background: #fff; border-bottom: 1px solid var(--line); }
.media img { width: 100%; height: 100%; object-fit: contain; padding: 14px; display: block; }
.media.none::after { content: "No photo"; position: absolute; inset: 0; display: grid; place-items: center; color: #8a93a1; font-size: .85rem; }
.pct { position: absolute; top: 10px; left: 10px; background: var(--save); color: #fff; font-weight: 700; font-size: .85rem; padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.rare { position: absolute; bottom: 10px; left: 10px; background: var(--rare-soft); color: var(--rare); font-weight: 600; font-size: .75rem; padding: 3px 9px; border-radius: 999px; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.brand { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-height: 1.1em; }
.card h2 { margin: 0; font-size: 1rem; line-height: 1.3; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card h2 a { text-decoration: none; }
.card h2 a:hover { text-decoration: underline; }
.price { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.price strong { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; color: var(--save); }
.price s { color: var(--muted); font-size: .95rem; }
.price small { color: var(--muted); font-size: .8rem; font-weight: 500; letter-spacing: 0; }
.where { margin: 0; font-size: .86rem; color: var(--muted); }
.where b { color: var(--ink); font-weight: 600; }
.actions { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; }
.btn { flex: 1; text-align: center; text-decoration: none; border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: .9rem; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
.btn:hover { opacity: .88; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--muted); opacity: 1; }

.more { display: block; margin: 28px auto 0; padding: 12px 26px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer; }
.more:hover { border-color: var(--muted); }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
.empty b { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

/* Store dialog */
dialog { width: min(640px, calc(100vw - 24px)); max-height: min(80vh, 720px); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--card); color: var(--ink); box-shadow: 0 24px 64px rgba(0, 0, 0, .3); }
dialog:modal { overscroll-behavior: contain; }
dialog::backdrop { background: rgba(10, 14, 20, .5); backdrop-filter: blur(2px); overflow: hidden; overscroll-behavior: contain; }
.dhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
.dhead h3 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
.dhead p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.x { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.stores { list-style: none; margin: 0; padding: 4px 20px 16px; }
.stores li { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.stores li:last-child { border-bottom: 0; }
.stores .nm { font-weight: 600; }
.stores .ad { color: var(--muted); font-size: .85rem; grid-column: 1; }
.stores .pr { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--save); }
.stores .pr s { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: 6px; }
.stores .st { text-align: right; color: var(--muted); font-size: .85rem; }
.stores .go { grid-column: 1 / -1; font-size: .88rem; color: var(--accent); font-weight: 600; text-decoration: none; margin-top: 2px; }
.stores .go:hover { text-decoration: underline; }

footer { margin: 48px 0 40px; color: var(--muted); font-size: .85rem; }
footer details { max-width: 80ch; }
footer summary { cursor: pointer; font-weight: 600; color: var(--ink); }
footer p { margin: 10px 0 0; }

@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  .hero { padding-block: 26px 14px; }
  .controls { position: static; backdrop-filter: none; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .body { padding: 10px 12px 12px; }
  .price strong { font-size: 1.25rem; }
  .media img { padding: 8px; }
  .actions { flex-direction: column; }
  .sel select { max-width: none; }
  .sel { flex: 1 1 calc(50% - 8px); }
  .sel.cat { flex-basis: 100%; }
  .sel select { width: 100%; }
}
@media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<header class="wrap hero">
  <h1>Ontario outlier deals</h1>
  <p>Canadian Tire products at 50% off or more in some Ontario stores, but not in all of them.</p>
  <div class="stats" id="stats" aria-live="polite">Loading deals…</div>
</header>

<section class="controls" aria-label="Filters">
  <div class="wrap">
    <div class="row">
      <label class="search">
        <span class="sr" hidden>Search</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search deals" autocomplete="off" aria-label="Search products, brands or SKUs">
      </label>
      <div class="sel labeled cat"><span class="tag">Category</span><select id="cat" aria-label="Category"></select></div>
      <div class="sel labeled"><span class="tag">Near store</span><select id="store" aria-label="Near store"><option value="-1">Any store</option></select></div>
      <div class="sel labeled"><span class="tag">Distance</span><select id="radius" aria-label="Distance from the selected store">
        <option value="0">This store only</option>
        <option value="25">25 km</option>
        <option value="50" selected>50 km</option>
        <option value="100">100 km</option>
        <option value="200">200 km</option>
        <option value="-1">Anywhere</option>
      </select></div>
      <div class="sel labeled"><span class="tag">Stores with deal</span><select id="maxn" aria-label="How many stores have the deal">
        <option value="0" selected>Any</option>
        <option value="1">Only 1 store</option>
        <option value="3">3 or fewer</option>
        <option value="5">5 or fewer</option>
        <option value="10">10 or fewer</option>
        <option value="25">25 or fewer</option>
      </select></div>
      <div class="sel labeled"><span class="tag">Discount</span><select id="minpct" aria-label="Minimum discount">
        <option value="50" selected>50% or more</option>
        <option value="60">60% or more</option>
        <option value="70">70% or more</option>
        <option value="80">80% or more</option>
        <option value="90">90% or more</option>
      </select></div>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="status">
    <span id="count" aria-live="polite"></span>
    <div class="sel labeled"><span class="tag">Sort</span><select id="sort" aria-label="Sort by">
      <option value="save">Biggest $ saving</option>
      <option value="pct">Biggest % off</option>
      <option value="rare">Fewest stores</option>
      <option value="low">Lowest price</option>
      <option value="stock">Most in stock</option>
      <option value="dist">Closest store</option>
    </select></div>
  </div>
  <div class="grid" id="list"></div>
  <button class="more" id="more" type="button" hidden>Show more</button>
  <footer>
    <details>
      <summary>About this data</summary>
      <p id="foot"></p>
    </details>
  </footer>
</main>

<dialog id="dlg" closedby="any" aria-labelledby="dtitle">
  <div class="dhead">
    <div><h3 id="dtitle"></h3><p id="dsub"></p></div>
    <button class="x" type="button" id="dclose" aria-label="Close">×</button>
  </div>
  <ul class="stores" id="dlist"></ul>
</dialog>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n == null ? '' : '$' + n.toFixed(2);
  const offLabel = (d) => Math.max(50, Math.floor(d.raw * 100 + 0.05)) + '%';
  const stockTxt = (d) => d.q === undefined ? 'stock not checked' : d.q === null ? 'stock varies by option' : d.q + ' in stock';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PAGE = 48;
  let D = null, ITEMS = [], STORES = [], shown = PAGE, current = [], DIST = null;
  const state = { q: '', cat: -1, store: -1, radius: 50, maxn: 0, minpct: 50, sort: 'save' };

  try { const saved = JSON.parse(localStorage.getItem('ctOutlierFilters2') || 'null'); if (saved) Object.assign(state, saved, { q: '' }); } catch (e) {}
  function persist() { try { localStorage.setItem('ctOutlierFilters2', JSON.stringify({ store: state.store, radius: state.radius, maxn: state.maxn, minpct: state.minpct, sort: state.sort })); } catch (e) {} }

  function km(a, b) {
    if (a[3] == null || b[3] == null) return Infinity;
    const R = 6371, toR = Math.PI / 180;
    const dLat = (b[3] - a[3]) * toR, dLng = (b[4] - a[4]) * toR;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[3] * toR) * Math.cos(b[3] * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function imgUrl(v) {
    if (typeof v !== 'string' || !v) return '';
    if (/^product\/[A-Za-z0-9\/_.\-]+$/.test(v)) return 'https://media-www.canadiantire.ca/' + v + '?imwidth=400';
    if (/^https:\/\/media-www\.(canadiantire|partycity)\.ca\/[A-Za-z0-9\/_.\-]+$/.test(v)) return v + '?imwidth=400';
    return '';
  }

  function prepare(data) {
    D = data; STORES = data.stores;
    ITEMS = data.items.map(r => {
      const deals = r[7].map(d => {
        const raw = d[3] ? 1 - d[1] / d[3] : 0;
        const q = d.length > 4 ? (typeof d[4] === 'number' && d[4] >= 0 ? d[4] : null) : undefined;
        return { s: d[0], sale: d[1], saleMax: d[2], orig: d[3], q, raw, pct: Math.round(raw * 1000) / 10 };
      });
      return { code: r[0], title: r[1], url: r[2], brand: r[3] || '', sku: r[4] || '', cats: r[5], multi: !!r[6], img: imgUrl(r[8]), deals, n: deals.length, hay: (r[1] + ' ' + (r[3] || '') + ' ' + (r[4] || '') + ' ' + r[0]).toLowerCase() };
    });
  }

  function storeOpts() {
    const sorted = STORES.map((s, i) => [s[1], i]).sort((a, b) => a[0].localeCompare(b[0]));
    $('store').insertAdjacentHTML('beforeend', sorted.map(([name, i]) => `<option value="${i}">${esc(name)}</option>`).join(''));
  }

  function compute() {
    const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const home = state.store >= 0 ? STORES[state.store] : null;
    const dist = home ? STORES.map(s => km(home, s)) : null;
    const catCounts = new Array(D.cats.length).fill(0);
    let allCount = 0;
    const out = [];
    for (const it of ITEMS) {
      if (state.maxn && it.n > state.maxn) continue;
      if (terms.length && !terms.every(t => it.hay.includes(t))) continue;
      let vis = it.deals.filter(d => d.raw * 100 >= state.minpct - 0.05);
      if (home) {
        if (state.radius === 0) vis = vis.filter(d => d.s === state.store);
        else if (state.radius > 0) vis = vis.filter(d => dist[d.s] <= state.radius);
      }
      if (!vis.length) continue;
      it.cats.forEach(c => catCounts[c]++);
      allCount++;
      if (state.cat >= 0 && !it.cats.includes(state.cat)) continue;
      let best = vis[0];
      for (const d of vis) if (d.pct > best.pct || (d.pct === best.pct && d.sale < best.sale)) best = d;
      let near = null;
      if (dist) near = vis.reduce((m, d) => dist[d.s] < dist[m.s] ? d : m, vis[0]);
      out.push({ it, vis, best, near, nd: near ? dist[near.s] : null });
    }
    const by = {
      pct: (a, b) => b.best.pct - a.best.pct || a.it.n - b.it.n,
      rare: (a, b) => a.it.n - b.it.n || b.best.pct - a.best.pct,
      save: (a, b) => (b.best.orig - b.best.sale) - (a.best.orig - a.best.sale),
      low: (a, b) => a.best.sale - b.best.sale,
      stock: (a, b) => (b.best.q ?? -1) - (a.best.q ?? -1) || b.best.pct - a.best.pct,
      dist: (a, b) => (a.nd ?? 1e9) - (b.nd ?? 1e9) || b.best.pct - a.best.pct
    };
    out.sort(by[state.sort] || by.save);
    return { out, catCounts, allCount, dist };
  }

  function renderCats(counts, total) {
    const order = D.cats.map((c, i) => i).sort((x, y) => counts[y] - counts[x]);
    const opt = (i, label, n) => `<option value="${i}"${state.cat === i ? ' selected' : ''}>${esc(label)} (${n.toLocaleString()})</option>`;
    $('cat').innerHTML = `<option value="-1"${state.cat === -1 ? ' selected' : ''}>All categories</option>` + order.filter(i => counts[i] > 0 || state.cat === i).map(i => opt(i, D.cats[i], counts[i])).join('');
  }

  const storeName = (i) => STORES[i] ? STORES[i][1] : 'Store ' + i;
  const storeUrl = (it, s) => 'https://www.canadiantire.ca' + it.url + (STORES[s] ? '?store=' + String(STORES[s][0]).padStart(4, '0') : '');

  function card(r, idx, dist) {
    const { it, vis, best } = r;
    const lead = r.near && state.sort === 'dist' ? r.near : best;
    const url = storeUrl(it, lead.s);
    const km1 = (d) => dist ? ' · ' + Math.round(dist[d.s]) + ' km' : '';
    const rare = it.n === 1 ? 'Only 1 store' : it.n <= 5 ? it.n + ' stores' : '';
    const media = it.img
      ? `<a class="media" href="${esc(url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="${esc(it.img)}" alt="" width="400" height="400" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="pct">${offLabel(best)} off</span>${rare ? `<span class="rare">${rare}</span>` : ''}</a>`
      : `<a class="media none" href="${esc(url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><span class="pct">${offLabel(best)} off</span>${rare ? `<span class="rare">${rare}</span>` : ''}</a>`;
    const where = vis.length === 1
      ? `<b>${esc(storeName(vis[0].s))}</b>${km1(vis[0])} · ${stockTxt(vis[0])}`
      : `Best at <b>${esc(storeName(best.s))}</b>${km1(best)} · ${stockTxt(best)}`;
    const more = vis.length > 1 ? `<button type="button" class="btn ghost" data-stores="${idx}">All ${vis.length} stores</button>` : '';
    return `<article class="card">${media}
      <div class="body">
        <p class="brand">${esc(it.brand)}</p>
        <h2><a href="${esc(url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
        <p class="price"><strong>${it.multi ? '<small>from </small>' : ''}${fmt(best.sale)}</strong><s>${fmt(best.orig)}</s></p>
        <p class="where">${where}</p>
        <div class="actions"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">View deal</a>${more}</div>
      </div></article>`;
  }

  function render(resetPage) {
    if (!D) return;
    if (resetPage) shown = PAGE;
    const { out, catCounts, allCount, dist } = compute();
    current = out; DIST = dist;
    renderCats(catCounts, allCount);
    $('radius').disabled = state.store < 0;
    $('count').innerHTML = `<b>${out.length.toLocaleString()}</b> deal${out.length === 1 ? '' : 's'}`;
    $('list').innerHTML = out.length
      ? out.slice(0, shown).map((r, i) => card(r, i, dist)).join('')
      : '<div class="empty" style="grid-column:1/-1"><b>No deals match</b>Try a wider distance, a lower discount, or "Any" stores.</div>';
    const more = $('more');
    more.hidden = out.length <= shown;
    more.textContent = `Show ${Math.min(PAGE, out.length - shown)} more`;
  }

  function openStores(i) {
    const r = current[i]; if (!r) return;
    const { it, vis } = r;
    const listed = [...vis].sort((a, b) => DIST ? DIST[a.s] - DIST[b.s] : a.sale - b.sale);
    $('dtitle').textContent = it.title;
    $('dsub').textContent = `${vis.length} store${vis.length === 1 ? '' : 's'} with this discount${vis.length !== it.n ? ` (${it.n} in Ontario in total)` : ''}`;
    $('dlist').innerHTML = listed.map(d => `<li>
      <span class="nm">${esc(storeName(d.s))}${DIST ? ' · ' + Math.round(DIST[d.s]) + ' km' : ''}</span>
      <span class="pr">${fmt(d.sale)}${d.saleMax && d.saleMax !== d.sale ? '–' + fmt(d.saleMax) : ''}<s>${fmt(d.orig)}</s></span>
      <span class="ad">${esc(STORES[d.s] ? STORES[d.s][2] : '')}</span>
      <span class="st">${offLabel(d)} off · ${stockTxt(d)}</span>
      <a class="go" href="${esc(storeUrl(it, d.s))}" target="_blank" rel="noopener">Open at this store</a></li>`).join('');
    $('dlg').showModal();
    $('dlg').scrollTop = 0;
  }

  function summary() {
    const one = ITEMS.filter(i => i.n === 1).length;
    const when = new Date(D.generated);
    const day = when.toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
    $('stats').innerHTML = `<span><b>${ITEMS.length.toLocaleString()}</b> deals</span><span><b>${one.toLocaleString()}</b> at only one store</span><span><b>${D.storeCount}</b> Ontario stores checked</span><span>Updated <b>${esc(day)}</b></span>`;
    $('foot').innerHTML = `Prices, stock and photos come from canadiantire.ca for all ${D.storeCount} Ontario stores, scanned ${esc(when.toLocaleString('en-CA'))}. Only deals a store reported as in stock and still on sale are shown, and anything 50% off or more at every Ontario store is left out. Stock changes quickly, so call the store before you drive. Opening a deal switches your selected store on canadiantire.ca to that store. Items with several sizes or colours may be discounted for one option only: choose the option on the product page to see its price. Product photos load from Canadian Tire's image servers and belong to Canadian Tire and its brands. This is an independent tool and is not affiliated with Canadian Tire.`;
  }

  function wire() {
    const set = (k, v) => { state[k] = v; persist(); render(true); };
    let t = null;
    $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => set('q', e.target.value), 150); });
    $('store').addEventListener('change', e => set('store', +e.target.value));
    $('radius').addEventListener('change', e => set('radius', +e.target.value));
    $('maxn').addEventListener('change', e => set('maxn', +e.target.value));
    $('minpct').addEventListener('change', e => set('minpct', +e.target.value));
    $('sort').addEventListener('change', e => set('sort', e.target.value));
    $('cat').addEventListener('change', e => set('cat', +e.target.value));
    $('more').addEventListener('click', () => { shown += PAGE; render(false); });
    $('list').addEventListener('click', e => { const b = e.target.closest('button[data-stores]'); if (b) openStores(+b.dataset.stores); });
    $('dclose').addEventListener('click', () => $('dlg').close());
    $('list').addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG') { const box = t.parentNode; if (box) box.classList.add('none'); t.remove(); } }, true);
    const dlg = $('dlg');
    if (!('closedBy' in HTMLDialogElement.prototype)) {
      dlg.addEventListener('click', e => {
        if (e.target !== dlg) return;
        const r = dlg.getBoundingClientRect();
        if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) dlg.close();
      });
    }
    if (!(state.store >= -1 && state.store < STORES.length)) state.store = -1;
    if (![50, 60, 70, 80, 90].includes(state.minpct)) state.minpct = 50;
    $('store').value = String(state.store); $('radius').value = String(state.radius); $('maxn').value = String(state.maxn); $('minpct').value = String(state.minpct); $('sort').value = state.sort;
  }

  fetch('data/deals.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => { prepare(data); storeOpts(); wire(); summary(); render(true); })
    .catch(err => { $('stats').textContent = 'The deals could not load (' + err.message + '). Reload the page to try again.'; });
})();
</script>
</body>
</html>
